name: Publish verified EMS prerelease

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: verified-ems-prerelease
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.repository == 'schneider-de-com/ha-sunenergyxt-ems' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main' &&
        github.event.workflow_run.conclusion == 'success'))
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tested commit, not the mutable latest branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Validate packaged version and release notes
        id: release
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ]] &&
             git diff --quiet HEAD^ HEAD -- custom_components/sunenergyxt_ems/manifest.json; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          manifest = json.loads(Path("custom_components/sunenergyxt_ems/manifest.json").read_text())
          version = manifest["version"]
          if not isinstance(version, str) or not re.fullmatch(r"0\.1\.0b\d+", version):
              raise SystemExit("Refusing to publish a non-beta or invalid version")
          notes = Path(f"RELEASE_NOTES_{version}.md")
          if not notes.is_file() or not notes.read_text().startswith(f"# SunEnergyXT EMS v{version}"):
              raise SystemExit(f"Missing release notes matching {version}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"publish=true", file=output)
              print(f"tag=v{version}", file=output)
              print(f"notes={notes}", file=output)
          PY
      - name: Publish immutable tagged beta (idempotent)
        if: steps.release.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.release.outputs.tag }}
          NOTES: ${{ steps.release.outputs.notes }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving it unchanged"
            exit 0
          fi
          gh release create "$TAG" \
            --target "$(git rev-parse HEAD)" \
            --title "SunEnergyXT EMS $TAG" \
            --notes-file "$NOTES" \
            --prerelease
