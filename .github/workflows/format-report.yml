name: Ruff formatting report (temporary)

on:
  pull_request:

permissions:
  contents: read

jobs:
  report:
    if: github.head_ref == 'test/control-feedback-and-installation-contract'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Apply official formatter and output changed files for exact review
        run: |
          python -m pip install ruff
          ruff format custom_components tests
          python - <<'PY'
          import json
          from pathlib import Path
          from subprocess import check_output
          changed = check_output(
              ["git", "diff", "--name-only", "--", "custom_components", "tests"], text=True
          ).splitlines()
          print("FORMAT_COUNT=" + str(len(changed)))
          for name in changed:
              print("FORMATTED_JSON=" + json.dumps(
                  {"path": name, "content": Path(name).read_text(encoding="utf-8")}
              ))
          PY
