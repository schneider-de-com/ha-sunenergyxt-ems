name: Tests
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pytest ruff
      - run: python -m pytest -q
      - run: ruff check custom_components tests
