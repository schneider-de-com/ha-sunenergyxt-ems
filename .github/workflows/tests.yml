name: Tests

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install --upgrade pytest ruff mypy bandit
      - run: python -m pytest -q tests --ignore=tests/test_ha_lifecycle.py
      - run: ruff check custom_components tests
      - name: PEP 8 formatting audit
        run: ruff format --check custom_components tests
      - name: Security audit (Bandit)
        run: python -m bandit -q -r custom_components/sunenergyxt_ems
      - run: python -m mypy --strict --follow-imports=skip custom_components/sunenergyxt_ems/logic.py custom_components/sunenergyxt_ems/discovery.py custom_components/sunenergyxt_ems/pid.py

  hassfest:
    name: Home Assistant hassfest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether the integration is ready for validation
        id: integration
        shell: bash
        run: |
          if [[ -f custom_components/sunenergyxt_ems/manifest.json ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Hassfest is skipped until the integration manifest is added."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate Home Assistant integration
        if: steps.integration.outputs.present == 'true'
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master (no tagged release)

  homeassistant:
    name: Home Assistant runtime tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install 'homeassistant==2026.10.4' pytest pytest-asyncio pytest-cov
      - run: python -m pytest -q tests --ignore=tests/test_ha_lifecycle.py --cov=custom_components.sunenergyxt_ems --cov-report=term-missing

  ha-integration-lifecycle:
    name: Real HA entry, device and entity lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Install HA and Core's integration test helpers
        run: python -m pip install 'homeassistant==2026.10.4' 'pytest-homeassistant-custom-component==0.13.375' pytest pytest-asyncio
      - name: Exercise real Home Assistant config entry and registries
        run: python -m pytest -q tests/test_ha_lifecycle.py

  contract-negative-controls:
    name: Tests reject deliberately broken control contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - run: python -m pip install 'homeassistant==2026.10.4' pytest pytest-asyncio
      - name: Detect removed acknowledgement gate
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/sunenergyxt_ems/runtime.py")
          old = "confirmed = await self._hardware_feedback_matches(entity_id, pending.target)"
          content = path.read_text()
          assert content.count(old) == 1, "Cannot locate intended mutation"
          path.write_text(content.replace(old, "confirmed = True", 1))
          PY
          set +e
          python -m pytest -q tests/test_solarman_readback.py::test_optimistic_positive_command_cannot_open_feedback_gate > /tmp/mutation.log 2>&1
          result=$?
          set -e
          cat /tmp/mutation.log
          test "$result" -eq 1
          grep -q 'AssertionError' /tmp/mutation.log
      - name: Detect removed BK215 combined power limit
        shell: bash
        run: |
          git checkout -- custom_components/sunenergyxt_ems/runtime.py
          python - <<'PY'
          from pathlib import Path
          path = Path("custom_components/sunenergyxt_ems/logic.py")
          old = "1920, battery.output_limit_w"
          content = path.read_text()
          assert content.count(old) == 1, "Cannot locate intended mutation"
          path.write_text(content.replace(old, "10000, battery.output_limit_w", 1))
          PY
          set +e
          python -m pytest -q tests/test_policy_cases.py::test_positive_configured_limit_cannot_override_bk215_hardware_cap > /tmp/mutation.log 2>&1
          result=$?
          set -e
          cat /tmp/mutation.log
          test "$result" -eq 1
          grep -q 'AssertionError' /tmp/mutation.log
