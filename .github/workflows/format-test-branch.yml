name: Format test-branch files (temporary)

on:
  push:
    branches:
      - test/control-feedback-and-installation-contract

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out this isolated development branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: test/control-feedback-and-installation-contract
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
      - name: Format checked source and tests
        run: |
          python -m pip install ruff
          ruff format custom_components tests
      - name: Commit formatting changes only
        run: |
          if ! git diff --quiet -- custom_components tests; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add custom_components tests
            git commit -m "style: enforce formatting gate for EMS code and tests (Refs #27)"
            git push origin HEAD:test/control-feedback-and-installation-contract
          fi
